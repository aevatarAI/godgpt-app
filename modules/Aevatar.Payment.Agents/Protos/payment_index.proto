syntax = "proto3";

package aevatar.payment.agents.protos;

option csharp_namespace = "Aevatar.Payment.Agents.Protos";

import "google/protobuf/timestamp.proto";

// =============================================================================
// PaymentIndexGAgent State (User Level - Lightweight)
// =============================================================================

message PaymentIndexStateProto {
  // User identifier
  string user_id = 1;
  
  // Platform customer IDs (key: platform enum as string, e.g., "0" for Stripe)
  map<string, string> platform_customers = 2;
  
  // Active subscriptions only (typically 1-3, max ~10)
  repeated ActiveSubscriptionProto active_subscriptions = 3;
  
  // Simple counters (fixed size)
  int32 total_payment_count = 4;
  int32 active_subscription_count = 5;
  
  // Metadata
  google.protobuf.Timestamp last_updated = 6;
}

// Active subscription info (minimal fields for display and routing)
message ActiveSubscriptionProto {
  string payment_id = 1;              // PaymentRecordGAgent ID
  string business_type = 2;           // Business type (godgpt/course/api)
  string business_id = 3;             // Business entity ID
  int32 platform = 4;                 // PaymentPlatform enum
  string product_name = 5;            // Display name
  int64 amount = 6;                   // Amount in smallest unit
  string currency = 7;                // Currency code
  google.protobuf.Timestamp period_end = 8;  // Subscription end time
  google.protobuf.Timestamp created_at = 9;
  string subscription_id = 10;        // Platform subscription ID (for cancellation lookup)
}

// =============================================================================
// PaymentIndexGAgent Events
// =============================================================================

message PlatformCustomerUpdatedEvent {
  int32 platform = 1;
  string customer_id = 2;
}

message ActiveSubscriptionAddedEvent {
  ActiveSubscriptionProto subscription = 1;
}

message ActiveSubscriptionRemovedEvent {
  string payment_id = 1;
}

message SubscriptionPeriodEndUpdatedEvent {
  string payment_id = 1;
  google.protobuf.Timestamp new_period_end = 2;
}

message SubscriptionIdUpdatedEvent {
  string payment_id = 1;
  string subscription_id = 2;
}

message PaymentCountIncrementedEvent {
  int32 new_count = 1;
}

message IndexClearedEvent {
  google.protobuf.Timestamp cleared_at = 1;
}

message PaymentIndexInitializedEvent {
  string user_id = 1;
  google.protobuf.Timestamp initialized_at = 2;
}

// =============================================================================
// RPC Response Types (for cross-runtime communication)
// =============================================================================

// Wrapper for List<ActiveSubscription> (RPC requires Protobuf types)
message ActiveSubscriptionListResponse {
  repeated ActiveSubscriptionProto subscriptions = 1;
}

// Request type for payment record creation (must be Protobuf for RPC)
message CreatePaymentRequestProto {
  // User info
  string user_id = 1;
  string external_order_id = 2;
  
  // Business context
  string business_type = 3;
  string business_id = 4;
  map<string, string> business_metadata = 5;
  string callback_agent_id = 6;     // Optional: Guid as string for point-to-point callback
  
  // Platform info
  int32 platform = 7;               // PaymentPlatform enum
  string environment = 8;           // Production/Sandbox
  string customer_id = 9;
  string subscription_id = 10;
  
  // Product info
  string product_id = 11;
  string price_id = 12;
  string product_name = 13;
  int32 payment_mode = 14;          // PaymentMode enum
  
  // Billing cycle
  int32 billing_cycle = 15;         // BillingCycle enum
  google.protobuf.Timestamp period_start = 16;
  google.protobuf.Timestamp period_end = 17;
  
  // Amount info
  int64 amount = 18;                // Amount in smallest unit
  string currency = 19;
  int64 net_amount = 20;            // Optional: after discounts
}

