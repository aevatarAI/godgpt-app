syntax = "proto3";

package aevatar.agents.creative_reasoning;
option csharp_namespace = "Aevatar.Agents.CreativeReasoning.Messages";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// ============================================================
//  Universe of Thoughts (UoT) - Creative Reasoning Framework
//  Based on: https://arxiv.org/html/2511.20471v2
//  
//  C-UoT Flow:
//  1. Analogical Retrieval & Solution Harvesting
//  2. Decompose Each Solution into Thoughts
//  3. Choose Host & Substitution Sites
//  4. Far-then-Analogical Donor Selection
//  5. Substitute to Synthesize New Combinations
//  6. Evaluate and Rank by Feasibility, Utility, Novelty
// ============================================================

// ============================================================
//  Core Data Types
// ============================================================

// Thought Unit - atomic idea element
message ThoughtUnit {
    string id = 1;
    string content = 2;
    string source_problem = 3;       // Which analogous problem this came from
    string source_solution = 4;      // Which solution this was extracted from
    repeated float embedding = 5;    // Semantic embedding vector
    ThoughtType type = 6;
    int32 position = 7;              // Position in original solution
    float semantic_distance = 8;     // Distance from original problem (for donor selection)
}

enum ThoughtType {
    THOUGHT_TYPE_UNKNOWN = 0;
    THOUGHT_TYPE_CORE = 1;           // Core mechanism/principle
    THOUGHT_TYPE_COMPONENT = 2;      // Functional component
    THOUGHT_TYPE_INTERACTION = 3;    // How components interact
    THOUGHT_TYPE_CONSTRAINT = 4;     // Constraints/boundaries
    THOUGHT_TYPE_OUTPUT = 5;         // Expected outputs/effects
}

// Analogous Problem with its solutions
message AnalogousProblem {
    string id = 1;
    string description = 2;
    string domain = 3;               // Domain category (e.g., "distributed_systems", "biology")
    float similarity = 4;            // Semantic similarity to original problem
    repeated AnalogousSolution solutions = 5;
}

message AnalogousSolution {
    string id = 1;
    string content = 2;
    string problem_id = 3;
    repeated ThoughtUnit thoughts = 4;   // Decomposed thoughts
    float effectiveness = 5;             // How well it solves the analogous problem
}

// Candidate Solution - synthesized creative solution
message CandidateSolution {
    string id = 1;
    string content = 2;
    string host_solution_id = 3;         // The base solution used as host
    repeated ThoughtSubstitution substitutions = 4;
    CreativeScore score = 5;
    google.protobuf.Timestamp created_at = 6;
}

message ThoughtSubstitution {
    ThoughtUnit original = 1;            // Original thought being replaced
    ThoughtUnit donor = 2;               // Donor thought from another solution
    int32 substitution_site = 3;         // Position in host solution
    string rationale = 4;                // Why this substitution makes sense
}

// Creative Score - three-dimensional evaluation
message CreativeScore {
    float feasibility = 1;   // [0-1] Can this actually be implemented? (Hard constraint)
    float utility = 2;       // [0-1] How useful/effective is this solution?
    float novelty = 3;       // [0-1] How different from existing solutions?
    float composite = 4;     // Weighted combination
    string evaluation_rationale = 5;
}

// ============================================================
//  Agent State Types
// ============================================================

message UoTCoordinatorState {
    string execution_id = 1;
    string original_problem = 2;
    UoTExecutionPhase phase = 3;
    
    // Collected data through phases
    repeated AnalogousProblem analogies = 4;
    repeated ThoughtUnit all_thoughts = 5;
    string host_solution_id = 6;
    repeated int32 substitution_sites = 7;
    repeated CandidateSolution candidates = 8;
    CandidateSolution best_solution = 9;
    
    // Telemetry
    int32 total_llm_calls = 10;
    int64 total_tokens = 11;
    google.protobuf.Timestamp started_at = 12;
    google.protobuf.Timestamp completed_at = 13;
    
    // Configuration
    int32 max_analogies = 14;
    int32 max_candidates = 15;
    float feasibility_threshold = 16;
}

enum UoTExecutionPhase {
    UOT_PHASE_IDLE = 0;
    UOT_PHASE_RETRIEVING_ANALOGIES = 1;
    UOT_PHASE_DECOMPOSING_THOUGHTS = 2;
    UOT_PHASE_SELECTING_HOST = 3;
    UOT_PHASE_SELECTING_DONORS = 4;
    UOT_PHASE_SYNTHESIZING = 5;
    UOT_PHASE_EVALUATING = 6;
    UOT_PHASE_COMPLETED = 7;
    UOT_PHASE_FAILED = 8;
}

message UoTCoordinatorConfig {
    int32 max_analogies = 1;             // Max analogous problems to retrieve
    int32 solutions_per_analogy = 2;     // Solutions per analogous problem
    int32 max_candidates = 3;            // Max candidate solutions to generate
    float feasibility_threshold = 4;     // Min feasibility score (hard constraint)
    float semantic_similarity_threshold = 5;
    
    // Weights for composite score
    float utility_weight = 6;
    float novelty_weight = 7;
    
    // Far-then-Analogical parameters
    float far_distance_threshold = 8;    // Threshold for "far" donors
    int32 far_donors_count = 9;          // Number of far donors to consider
}

message AnalogyRetrieverState {
    string coordinator_id = 1;
    int32 analogies_found = 2;
    int32 solutions_collected = 3;
}

message ThoughtSynthesizerState {
    string coordinator_id = 1;
    int32 candidates_generated = 2;
    int32 substitutions_made = 3;
}

message EvaluatorState {
    string coordinator_id = 1;
    int32 candidates_evaluated = 2;
    int32 candidates_passed = 3;      // Passed feasibility threshold
}

// ============================================================
//  Events: External -> Coordinator
// ============================================================

// Start C-UoT creative reasoning
message StartCreativeReasoningRequest {
    string execution_id = 1;
    string problem = 2;                  // The problem to solve creatively
    string domain_hint = 3;              // Optional domain context
    map<string, string> context = 4;     // Additional context
    string provider_name = 5;            // LLM provider
    
    // Configuration overrides
    int32 max_analogies = 6;
    int32 max_candidates = 7;
    float feasibility_threshold = 8;
    float utility_weight = 9;
    float novelty_weight = 10;
}

// ============================================================
//  Events: Coordinator -> Workers
// ============================================================

// Request analogy retrieval
message RetrieveAnalogiesRequest {
    string request_id = 1;
    string problem = 2;
    string domain_hint = 3;
    int32 max_count = 4;
    int32 solutions_per_analogy = 5;
}

// Request thought decomposition
message DecomposeThoughtsRequest {
    string request_id = 1;
    AnalogousSolution solution = 2;
}

// Request host selection
message SelectHostRequest {
    string request_id = 1;
    repeated AnalogousSolution solutions = 2;
    string original_problem = 3;
}

// Request donor selection (Far-then-Analogical)
message SelectDonorsRequest {
    string request_id = 1;
    AnalogousSolution host = 2;
    repeated int32 substitution_sites = 3;
    repeated ThoughtUnit all_thoughts = 4;   // Pool of available thoughts
    float far_distance_threshold = 5;
    int32 far_donors_count = 6;
}

// Request solution synthesis
message SynthesizeSolutionRequest {
    string request_id = 1;
    AnalogousSolution host = 2;
    repeated ThoughtSubstitution substitutions = 3;
    string original_problem = 4;
}

// Request creative evaluation
message EvaluateCandidateRequest {
    string request_id = 1;
    CandidateSolution candidate = 2;
    string original_problem = 3;
    repeated string existing_solutions = 4;  // For novelty comparison
}

// ============================================================
//  Events: Workers -> Coordinator
// ============================================================

// Analogies retrieved
message AnalogiesRetrieved {
    string request_id = 1;
    repeated AnalogousProblem analogies = 2;
    int32 llm_calls = 3;
    int32 tokens_used = 4;
}

// Thoughts decomposed
message ThoughtsDecomposed {
    string request_id = 1;
    string solution_id = 2;
    repeated ThoughtUnit thoughts = 3;
    int32 llm_calls = 4;
    int32 tokens_used = 5;
}

// Host selected
message HostSelected {
    string request_id = 1;
    string host_solution_id = 2;
    repeated int32 substitution_sites = 3;
    string selection_rationale = 4;
    int32 llm_calls = 5;
    int32 tokens_used = 6;
}

// Donors selected
message DonorsSelected {
    string request_id = 1;
    repeated ThoughtSubstitution substitutions = 2;
    int32 llm_calls = 3;
    int32 tokens_used = 4;
}

// Solution synthesized
message SolutionSynthesized {
    string request_id = 1;
    CandidateSolution candidate = 2;
    int32 llm_calls = 3;
    int32 tokens_used = 4;
}

// Candidate evaluated
message CandidateEvaluated {
    string request_id = 1;
    string candidate_id = 2;
    CreativeScore score = 3;
    int32 llm_calls = 4;
    int32 tokens_used = 5;
}

// ============================================================
//  Events: Coordinator -> External (Completion)
// ============================================================

message CreativeReasoningCompleted {
    string execution_id = 1;
    bool success = 2;
    CandidateSolution best_solution = 3;
    repeated CandidateSolution all_candidates = 4;  // Ranked by composite score
    string error = 5;
    
    // Telemetry
    int32 total_llm_calls = 6;
    int64 total_tokens = 7;
    int64 duration_ms = 8;
    
    // Trace for analysis
    UoTTrace trace = 9;
}

message UoTTrace {
    string execution_id = 1;
    string original_problem = 2;
    repeated AnalogousProblem analogies_explored = 3;
    int32 thoughts_extracted = 4;
    int32 candidates_generated = 5;
    int32 candidates_passed_feasibility = 6;
}

// ============================================================
//  Progress Events
// ============================================================

message UoTProgressEvent {
    string execution_id = 1;
    UoTExecutionPhase phase = 2;
    string message = 3;
    float progress_percent = 4;
    google.protobuf.Timestamp timestamp = 5;
}

// ============================================================
//  E-UoT (Exploratory UoT) Types
//  Extends C-UoT with Step E: Exploratory Idea Expansion
//  Discovers novel "outside thoughts" beyond existing solutions
// ============================================================

// Outside thought discovered through exploration
message OutsideThought {
    string id = 1;
    string content = 2;
    string exploration_source = 3;  // Where this thought came from
    string exploration_method = 4;  // How it was discovered
    repeated float embedding = 5;
    float novelty_score = 6;        // How novel compared to existing thoughts
    float relevance_score = 7;      // How relevant to original problem
}

message EUoTCoordinatorState {
    string execution_id = 1;
    string original_problem = 2;
    EUoTExecutionPhase phase = 3;
    
    // C-UoT inherited data
    repeated AnalogousProblem analogies = 4;
    repeated ThoughtUnit all_thoughts = 5;
    string host_solution_id = 6;
    repeated int32 substitution_sites = 7;
    repeated CandidateSolution candidates = 8;
    CandidateSolution best_solution = 9;
    
    // E-UoT specific: outside thoughts discovered
    repeated OutsideThought outside_thoughts = 10;
    repeated string exploration_directions = 11;
    
    // Telemetry
    int32 total_llm_calls = 12;
    int64 total_tokens = 13;
    google.protobuf.Timestamp started_at = 14;
    google.protobuf.Timestamp completed_at = 15;
    
    // Configuration
    int32 max_analogies = 16;
    int32 max_candidates = 17;
    float feasibility_threshold = 18;
    int32 max_outside_thoughts = 19;
}

enum EUoTExecutionPhase {
    EUOT_PHASE_IDLE = 0;
    EUOT_PHASE_RETRIEVING_ANALOGIES = 1;
    EUOT_PHASE_DECOMPOSING_THOUGHTS = 2;
    EUOT_PHASE_EXPLORING_IDEAS = 3;       // Step E: New exploratory step
    EUOT_PHASE_SELECTING_HOST = 4;
    EUOT_PHASE_SELECTING_DONORS = 5;
    EUOT_PHASE_SYNTHESIZING = 6;
    EUOT_PHASE_EVALUATING = 7;
    EUOT_PHASE_COMPLETED = 8;
    EUOT_PHASE_FAILED = 9;
}

message EUoTCoordinatorConfig {
    // C-UoT inherited config
    int32 max_analogies = 1;
    int32 solutions_per_analogy = 2;
    int32 max_candidates = 3;
    float feasibility_threshold = 4;
    float semantic_similarity_threshold = 5;
    float utility_weight = 6;
    float novelty_weight = 7;
    float far_distance_threshold = 8;
    int32 far_donors_count = 9;
    
    // E-UoT specific config
    int32 max_outside_thoughts = 10;         // Max outside thoughts to discover
    int32 exploration_directions = 11;       // Number of exploration directions
    float outside_thought_relevance = 12;    // Min relevance threshold
}

// ============================================================
//  T-UoT (Transformative UoT) Types
//  The most profound creative process: changing the rules
//  Exposes hidden assumptions and mutates rule sets
// ============================================================

// Rule extracted from problem/solution space
message Rule {
    string id = 1;
    string content = 2;
    RuleType type = 3;
    bool is_explicit = 4;         // Explicit vs hidden assumption
    float constraint_strength = 5; // How constraining is this rule
    string domain = 6;
}

enum RuleType {
    RULE_TYPE_UNKNOWN = 0;
    RULE_TYPE_PHYSICAL = 1;       // Physical/natural constraints
    RULE_TYPE_SOCIAL = 2;         // Social/cultural norms
    RULE_TYPE_ECONOMIC = 3;       // Economic constraints
    RULE_TYPE_TECHNICAL = 4;      // Technical limitations
    RULE_TYPE_ASSUMPTION = 5;     // Hidden assumptions
    RULE_TYPE_CONVENTION = 6;     // Industry conventions
}

// Mutated rule set representing new solution space
message MutatedRuleSet {
    string id = 1;
    repeated Rule original_rules = 2;
    repeated RuleMutation mutations = 3;
    repeated Rule resulting_rules = 4;
    string mutation_rationale = 5;
    float radicality_score = 6;   // How radical is this transformation
}

message RuleMutation {
    string rule_id = 1;
    MutationType mutation_type = 2;
    string original_content = 3;
    string mutated_content = 4;
    string mutation_rationale = 5;
}

enum MutationType {
    MUTATION_TYPE_UNKNOWN = 0;
    MUTATION_TYPE_NEGATE = 1;     // Negate the rule entirely
    MUTATION_TYPE_WEAKEN = 2;     // Make rule less strict
    MUTATION_TYPE_STRENGTHEN = 3; // Make rule more strict (for constraint)
    MUTATION_TYPE_GENERALIZE = 4; // Broaden the rule
    MUTATION_TYPE_SPECIALIZE = 5; // Narrow the rule
    MUTATION_TYPE_COMBINE = 6;    // Combine with another rule
    MUTATION_TYPE_REMOVE = 7;     // Remove entirely
}

// Solution discovered in new rule space
message TransformativeSolution {
    string id = 1;
    string content = 2;
    MutatedRuleSet rule_set = 3;          // Which rule set enabled this
    repeated Rule violated_conventions = 4;// Which conventions are violated
    CreativeScore score = 5;
    google.protobuf.Timestamp created_at = 6;
}

message TUoTCoordinatorState {
    string execution_id = 1;
    string original_problem = 2;
    TUoTExecutionPhase phase = 3;
    
    // T-UoT specific: rules and mutations
    repeated Rule exposed_rules = 4;
    repeated Rule hidden_assumptions = 5;
    repeated MutatedRuleSet mutated_rule_sets = 6;
    repeated TransformativeSolution transformative_solutions = 7;
    TransformativeSolution best_solution = 8;
    
    // For reference: also run E-UoT in each rule space
    repeated OutsideThought outside_thoughts = 9;
    repeated AnalogousProblem analogies = 10;
    repeated ThoughtUnit all_thoughts = 11;
    
    // Telemetry
    int32 total_llm_calls = 12;
    int64 total_tokens = 13;
    google.protobuf.Timestamp started_at = 14;
    google.protobuf.Timestamp completed_at = 15;
    
    // Configuration
    int32 max_rule_sets = 16;
    float feasibility_threshold = 17;
}

enum TUoTExecutionPhase {
    TUOT_PHASE_IDLE = 0;
    TUOT_PHASE_EXPOSING_RULES = 1;        // Step 1: Expose rules including hidden
    TUOT_PHASE_MUTATING_RULES = 2;        // Step 2: Generate mutated rule sets
    TUOT_PHASE_EXPLORING_SPACES = 3;      // Step 3: Explore each new rule space
    TUOT_PHASE_SYNTHESIZING = 4;
    TUOT_PHASE_EVALUATING = 5;
    TUOT_PHASE_COMPLETED = 6;
    TUOT_PHASE_FAILED = 7;
}

message TUoTCoordinatorConfig {
    int32 max_rule_sets = 1;              // Max mutated rule sets to explore
    int32 mutations_per_set = 2;          // Mutations per rule set
    float min_radicality = 3;             // Min radicality for transformative solutions
    float feasibility_threshold = 4;
    float utility_weight = 5;
    float novelty_weight = 6;
    bool allow_physical_rule_violation = 7;  // Usually false
}

// ============================================================
//  E-UoT Events
// ============================================================

message StartEUoTRequest {
    string execution_id = 1;
    string problem = 2;
    string domain_hint = 3;
    string provider_name = 4;
    
    // Configuration
    int32 max_analogies = 5;
    int32 max_candidates = 6;
    float feasibility_threshold = 7;
    int32 max_outside_thoughts = 8;
    int32 exploration_directions = 9;
}

message ExploreIdeasRequest {
    string request_id = 1;
    string original_problem = 2;
    repeated ThoughtUnit existing_thoughts = 3;
    int32 max_outside_thoughts = 4;
    repeated string suggested_directions = 5;
}

message IdeasExplored {
    string request_id = 1;
    repeated OutsideThought outside_thoughts = 2;
    repeated string exploration_directions_used = 3;
    int32 llm_calls = 4;
    int32 tokens_used = 5;
}

message EUoTCompleted {
    string execution_id = 1;
    bool success = 2;
    CandidateSolution best_solution = 3;
    int32 outside_thoughts_discovered = 4;
    string error = 5;
    int32 total_llm_calls = 6;
    int64 total_tokens = 7;
    int64 duration_ms = 8;
}

// ============================================================
//  T-UoT Events
// ============================================================

message StartTUoTRequest {
    string execution_id = 1;
    string problem = 2;
    string domain_hint = 3;
    string provider_name = 4;
    
    // Configuration
    int32 max_rule_sets = 5;
    int32 mutations_per_set = 6;
    float min_radicality = 7;
    float feasibility_threshold = 8;
}

message ExposeRulesRequest {
    string request_id = 1;
    string problem = 2;
    string domain_hint = 3;
    bool include_hidden_assumptions = 4;
}

message RulesExposed {
    string request_id = 1;
    repeated Rule explicit_rules = 2;
    repeated Rule hidden_assumptions = 3;
    int32 llm_calls = 4;
    int32 tokens_used = 5;
}

message MutateRulesRequest {
    string request_id = 1;
    repeated Rule rules = 2;
    int32 max_rule_sets = 3;
    int32 mutations_per_set = 4;
}

message RulesMutated {
    string request_id = 1;
    repeated MutatedRuleSet rule_sets = 2;
    int32 llm_calls = 3;
    int32 tokens_used = 4;
}

message ExploreRuleSpaceRequest {
    string request_id = 1;
    string original_problem = 2;
    MutatedRuleSet rule_set = 3;
}

message RuleSpaceExplored {
    string request_id = 1;
    string rule_set_id = 2;
    repeated TransformativeSolution solutions = 3;
    int32 llm_calls = 4;
    int32 tokens_used = 5;
}

message TUoTCompleted {
    string execution_id = 1;
    bool success = 2;
    TransformativeSolution best_solution = 3;
    int32 rule_sets_explored = 4;
    int32 rules_exposed = 5;
    int32 assumptions_challenged = 6;
    string error = 7;
    int32 total_llm_calls = 8;
    int64 total_tokens = 9;
    int64 duration_ms = 10;
}

// ============================================================
//  UoT Mode Selection
// ============================================================

enum UoTMode {
    UOT_MODE_COMBINATIONAL = 0;   // C-UoT (default)
    UOT_MODE_EXPLORATORY = 1;     // E-UoT
    UOT_MODE_TRANSFORMATIVE = 2;  // T-UoT
}

