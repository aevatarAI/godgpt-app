# ============================================================
#  MAKER 策略 - 分解-共识-合成的可靠推理
# ============================================================

name: maker
version: "1.0"
description: 分解-共识-合成的可靠推理策略

inputs:
  - name: task
    type: string
    required: true
  - name: reliability
    type: string
    default: "medium"

steps:
  # Step 1: 判断是否原子任务
  - id: check_atomic
    type: llm_call
    prompt: |
      Is this task atomic (can be solved directly without decomposition)?
      
      Task: {{task}}
      
      An atomic task:
      - Can be solved in a single step
      - Does not require breaking into subtasks
      - Has a clear, direct answer
      
      Answer with ONLY "yes" or "no".
    output: first_line
    store: is_atomic_answer

  # Step 2: 条件分支
  - id: process
    type: conditional
    condition: "{{is_atomic_answer == 'yes'}}"
    
    if_true:
      # 原子任务：直接求解 + 投票共识
      - id: solve_atomic
        type: vote
        k: "{{consensus_k(reliability)}}"
        max_rounds: 10
        generator:
          type: llm_call
          prompt: |
            Solve this task directly and precisely:
            
            Task: {{task}}
            
            Provide a clear, complete answer.
          output: text
        store: solution
    
    if_false:
      # 复杂任务：分解 + 递归
      - id: decompose
        type: vote
        k: "{{consensus_k(reliability)}}"
        max_rounds: 10
        generator:
          type: llm_call
          prompt: |
            Decompose this complex task into 2-5 independent subtasks.
            
            Task: {{task}}
            
            Requirements:
            - Each subtask should be smaller and more focused
            - Subtasks should be independent when possible
            - Together they should solve the original task
            
            Output as JSON array:
            ```json
            [
              {"id": "1", "description": "Clear description of subtask 1"},
              {"id": "2", "description": "Clear description of subtask 2"}
            ]
            ```
          output: json_array
        store: subtasks
      
      # 检查点
      - id: checkpoint_after_decompose
        type: checkpoint
        variables:
          - subtasks
      
      # 递归处理子任务
      - id: solve_subtasks
        type: fan_out
        for_each: subtasks
        max_concurrency: 3
        step:
          type: workflow_call
          workflow: maker
          params:
            task: "{{item.description}}"
            reliability: "{{reliability}}"
          max_depth: 5
        reduce: collect
        store: subtask_results
      
      # 合成最终结果
      - id: compose
        type: llm_call
        prompt: |
          Compose a final, coherent answer from these subtask results.
          
          Original task: {{task}}
          
          Subtask results:
          {{subtask_results | json}}
          
          Instructions:
          - Integrate all subtask results into a complete answer
          - Ensure the answer fully addresses the original task
          - Resolve any conflicts between subtask results
        output: text
        store: solution

output:
  result: "{{solution}}"
  is_atomic: "{{is_atomic_answer}}"
  subtasks_count: "{{subtasks | length}}"

