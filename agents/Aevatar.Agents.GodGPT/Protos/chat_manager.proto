syntax = "proto3";

package aevatar.agents.godgpt.protos.chatmanager;

import "google/protobuf/timestamp.proto";
import "Protos/user_quota.proto";
import "Protos/god_chat.proto";

option csharp_namespace = "Aevatar.Agents.GodGPT.Protos.ChatManager";

// =============================================================================
// State
// =============================================================================

message ChatManagerStateProto {
  repeated SessionInfoProto session_info_list = 1;
  string user_id = 2;  // Guid as string
  int32 max_session = 3;
  string gender = 4;
  google.protobuf.Timestamp birth_date = 5;
  string birth_place = 6;
  string full_name = 7;
  int32 max_share_count = 8;
  int32 current_share_count = 9;
  optional bool is_first_conversation = 10;
  optional google.protobuf.Timestamp registered_at_utc = 11;
  optional string inviter_id = 12;  // Guid? as string
  int32 voice_language = 13;  // VoiceLanguageEnum as int
  int32 state_version = 20;
}

message SessionInfoProto {
  string session_id = 1;  // Guid as string
  string title = 2;
  google.protobuf.Timestamp create_at = 3;
  optional string guider = 4;
  repeated string share_ids = 5;  // List<Guid> as strings - supports multiple share links
}

// =============================================================================
// RPC Response Types
// =============================================================================

message SessionListProto {
  repeated SessionInfoProto sessions = 1;
}

// Response type for GetSessionCreationInfoAsync
message SessionCreationInfoProto {
  string session_id = 1;  // Guid as string
  string title = 2;
  google.protobuf.Timestamp create_at = 3;
  optional string guider = 4;
}

// =============================================================================
// DTO Types for RPC (reusing types from god_chat.proto)
// =============================================================================

// Combined message + meta for history with voice info
// Reuses ChatMessageProto and ChatMessageMetaProto from god_chat.proto
message ChatMessageWithMetaEntryProto {
  aevatar.agents.godgpt.godchat.ChatMessageProto message = 1;
  aevatar.agents.godgpt.godchat.ChatMessageMetaProto meta = 2;
}

// List wrapper for ChatMessageWithMeta
message ChatMessageWithMetaListProto {
  repeated ChatMessageWithMetaEntryProto entries = 1;
}

// Share link data (reuses ChatMessageProto from god_chat.proto)
message ShareLinkProto {
  string user_id = 1;      // Guid as string
  string session_id = 2;   // Guid as string
  repeated aevatar.agents.godgpt.godchat.ChatMessageProto messages = 3;
  google.protobuf.Timestamp create_time = 4;
}

// User profile DTO for RPC responses
message UserProfileResponseProto {
  string gender = 1;
  google.protobuf.Timestamp birth_date = 2;
  string birth_place = 3;
  string full_name = 4;
  aevatar.agents.godgpt.userquota.CreditsInfoProto credits = 5;
  aevatar.agents.godgpt.userquota.SubscriptionInfoProto subscription = 6;
  aevatar.agents.godgpt.userquota.SubscriptionInfoProto ultimate_subscription = 7;
  string id = 8;                    // Guid as string
  optional string inviter_id = 9;   // Guid? as string
  int32 voice_language = 10;        // VoiceLanguageEnum as int (has -1 value)
  optional bool is_first_conversation = 11;
}

// =============================================================================
// Events
// =============================================================================

message CleanExpiredSessionsEvent {
  google.protobuf.Timestamp clean_before = 1;
}

message CreateSessionInfoEvent {
  string session_id = 1;  // Guid as string
  string title = 2;
  google.protobuf.Timestamp create_at = 3;
  optional string guider = 4;
}

message DeleteSessionEvent {
  string session_id = 1;  // Guid as string
}

message RenameTitleEvent {
  string session_id = 1;  // Guid as string
  string title = 2;
}

message ClearAllEvent {
}

message GenerateChatShareContentEvent {
  string session_id = 1;  // Guid as string
  string share_id = 2;    // Guid as string
}

message SetMaxShareCountEvent {
  int32 max_share_count = 1;
}

message SetRegisteredAtUtcEvent {
  google.protobuf.Timestamp registered_at_utc = 1;
}

message InitializeNewUserStatusEvent {
  bool is_first_conversation = 1;
  string user_id = 2;  // Guid as string
  optional google.protobuf.Timestamp registered_at_utc = 3;
  int32 max_share_count = 4;
}

// ShareLinkGAgent event - persists share content
message SaveShareContentEvent {
  string user_id = 1;      // Guid as string
  string session_id = 2;   // Guid as string
  repeated aevatar.agents.godgpt.godchat.ChatMessageProto messages = 3;
  google.protobuf.Timestamp create_time = 4;
}

// =============================================================================
// Response Events (for PublishAsync to subscribers)
// =============================================================================

message ResponseCreateGodProto {
  int32 response_type = 1;  // ResponseType enum
  string session_id = 2;     // Guid as string
  string session_version = 3;
}

message ResponseStreamGodChatProto {
  int32 response_type = 1;
  string response = 2;
  string new_title = 3;
  string chat_id = 4;
  bool is_last_chunk = 5;
  int32 serial_number = 6;
  string session_id = 7;
  bytes audio_data = 8;
}
