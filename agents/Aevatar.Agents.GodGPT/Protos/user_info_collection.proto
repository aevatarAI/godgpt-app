syntax = "proto3";

package aevatar.agents.godgpt.userinfocollection;

option csharp_namespace = "Aevatar.Agents.GodGPT.Protos.UserInfoCollection";

import "google/protobuf/timestamp.proto";

// =============================================================================
// State
// =============================================================================

message UserInfoCollectionState {
    string user_id = 1;                                   // [Id(0)] Guid -> string
    bool is_initialized = 2;                              // [Id(1)]
    google.protobuf.Timestamp created_at = 3;             // [Id(2)]
    google.protobuf.Timestamp last_updated = 4;           // [Id(3)]
    
    // Name information (Step 2)
    int32 gender = 5;                                     // [Id(4)] 1:male 2:female
    string first_name = 6;                                // [Id(5)]
    string last_name = 7;                                 // [Id(6)]
    
    // Location information (Step 3)
    string country = 8;                                   // [Id(7)]
    string city = 9;                                      // [Id(8)]
    
    // Birth date information (Step 4)
    int32 day = 10;                                       // [Id(9)]
    int32 month = 11;                                     // [Id(10)]
    int32 year = 12;                                      // [Id(11)]
    
    // Birth time information (Step 5) - Optional
    optional int32 hour = 13;                             // [Id(12)]
    optional int32 minute = 14;                           // [Id(13)]
    
    // Seeking interests (Step 6) - Original text values
    repeated string seeking_interests = 15;               // [Id(14)]
    
    // Source channels (Step 7) - Original text values
    repeated string source_channels = 16;                 // [Id(15)]
    
    // Seeking interests codes (Step 6) - Enum values for statistics
    repeated int32 seeking_interests_code = 17;           // [Id(16)]
    
    // Source channels codes (Step 7) - Enum values for statistics
    repeated int32 source_channels_code = 18;             // [Id(17)]
    
    int32 fix_state = 19;                                 // [Id(18)]
}

// =============================================================================
// Events
// =============================================================================

message InitializeUserInfoCollectionEvent {
    string user_id = 1;                                   // [Id(0)]
    google.protobuf.Timestamp created_at = 2;             // [Id(1)]
}

message UpdateUserInfoCollectionEvent {
    optional int32 gender = 1;                            // [Id(0)]
    string first_name = 2;                                // [Id(1)]
    string last_name = 3;                                 // [Id(2)]
    string country = 4;                                   // [Id(3)]
    string city = 5;                                      // [Id(4)]
    optional int32 day = 6;                               // [Id(5)]
    optional int32 month = 7;                             // [Id(6)]
    optional int32 year = 8;                              // [Id(7)]
    optional int32 hour = 9;                              // [Id(8)]
    optional int32 minute = 10;                           // [Id(9)]
    repeated string seeking_interests = 11;               // [Id(10)]
    repeated string source_channels = 12;                 // [Id(11)]
    repeated int32 seeking_interests_code = 13;           // [Id(12)]
    repeated int32 source_channels_code = 14;             // [Id(13)]
    google.protobuf.Timestamp updated_at = 15;            // [Id(14)]
    string user_id = 16;                                  // [Id(15)]
}

message ClearUserInfoCollectionEvent {
}

message UpdateFixStateEvent {
    int32 fix_state = 1;                                  // [Id(0)]
}

// =============================================================================
// RPC Request/Response Types
// =============================================================================

message UpdateUserInfoCollectionRequestProto {
    string user_id = 1;                                   // Guid -> string
    optional UserNameInfoProto name_info = 2;
    optional UserLocationInfoProto location_info = 3;
    optional UserBirthDateInfoProto birth_date_info = 4;
    optional UserBirthTimeInfoProto birth_time_info = 5;
    repeated int32 seeking_interests = 6;                 // SeekingInterestEnum values
    repeated int32 source_channels = 7;                   // SourceChannelEnum values
}

message UserNameInfoProto {
    int32 gender = 1;
    string first_name = 2;
    string last_name = 3;
}

message UserLocationInfoProto {
    string country = 1;
    string city = 2;
}

message UserBirthDateInfoProto {
    optional int32 day = 1;
    optional int32 month = 2;
    optional int32 year = 3;
}

message UserBirthTimeInfoProto {
    optional int32 hour = 1;
    optional int32 minute = 2;
}

message UserInfoCollectionResponseProto {
    bool success = 1;
    string message = 2;
    UserInfoCollectionProto data = 3;
}

message UserInfoCollectionProto {
    string user_id = 1;                                   // Guid -> string
    optional UserNameInfoProto name_info = 2;
    optional UserLocationInfoProto location_info = 3;
    optional UserBirthDateInfoProto birth_date_info = 4;
    optional UserBirthTimeInfoProto birth_time_info = 5;
    repeated string seeking_interests = 6;
    repeated string source_channels = 7;
    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
    bool is_completed = 10;
    bool is_initialized = 11;
    repeated int32 seeking_interests_code = 12;
    repeated int32 source_channels_code = 13;
}

message UserInfoDisplayProto {
    string first_name = 1;
    string last_name = 2;
    int32 gender = 3;
    int32 day = 4;
    int32 month = 5;
    int32 year = 6;
    optional int32 hour = 7;
    optional int32 minute = 8;
    string country = 9;
    string city = 10;
    repeated string seeking_interests = 11;
    repeated string source_channels = 12;
}

message UserInfoOptionsResponseProto {
    bool success = 1;
    string message = 2;
    repeated SeekingInterestOptionProto seeking_interest_options = 3;
    repeated SourceChannelOptionProto source_channel_options = 4;
}

message SeekingInterestOptionProto {
    int32 code = 1;
    string text = 2;
}

message SourceChannelOptionProto {
    int32 code = 1;
    string text = 2;
    string desc = 3;
}

message GenerateUserInfoPromptRequestProto {
    string user_id = 1;                                   // Guid -> string
    optional google.protobuf.Timestamp user_local_time = 2;
}

message GenerateUserInfoPromptResponseProto {
    string full_name = 1;
    string prompt = 2;
}

