syntax = "proto3";

package aevatar.agents.godgpt.userquota;

option csharp_namespace = "Aevatar.Agents.GodGPT.Protos.UserQuota";

import "google/protobuf/timestamp.proto";

// =============================================================================
// Enums
// =============================================================================

enum QuotaPlanType {
    NONE = 0;
    DAY = 1;
    MONTH = 2;
    YEAR = 3;
    WEEK = 4;
}

// Payment status
enum QuotaPaymentStatus {
  QUOTA_PAYMENT_STATUS_NONE = 0;
  QUOTA_PAYMENT_STATUS_PENDING = 1;
  QUOTA_PAYMENT_STATUS_PROCESSING = 2;
  QUOTA_PAYMENT_STATUS_COMPLETED = 3;
  QUOTA_PAYMENT_STATUS_FAILED = 4;
  QUOTA_PAYMENT_STATUS_REFUNDED_IN_PROCESSING = 5;
  QUOTA_PAYMENT_STATUS_REFUNDED = 6;
  QUOTA_PAYMENT_STATUS_CANCELLED_IN_PROCESSING = 7;
  QUOTA_PAYMENT_STATUS_CANCELLED = 8;
  QUOTA_PAYMENT_STATUS_DISPUTED = 9;
  QUOTA_PAYMENT_STATUS_CANCEL_PENDING = 10;
  QUOTA_PAYMENT_STATUS_UNKNOWN = 11;
}

// Action type
enum QuotaActionType {
  QUOTA_ACTION_TYPE_CONVERSATION = 0;
  QUOTA_ACTION_TYPE_VOICE_CONVERSATION = 1;
  QUOTA_ACTION_TYPE_IMAGE_CONVERSATION = 2;
}

// =============================================================================
// Nested Types
// =============================================================================

message SubscriptionInfoProto {
    bool is_active = 1;
    QuotaPlanType plan_type = 2;
    QuotaPaymentStatus status = 3;
    google.protobuf.Timestamp start_date = 4;
    google.protobuf.Timestamp end_date = 5;
    repeated string subscription_ids = 6;
    repeated string invoice_ids = 7;
}

message RateLimitInfoProto {
    int32 count = 1;
    google.protobuf.Timestamp last_time = 2;
}

message DailyImageConversationInfoProto {
    int32 count = 1;
    google.protobuf.Timestamp last_conversation_time = 2;
}

message FreeTrialInfoProto {
    string free_trial_code = 1;
    int32 trial_days = 2;
    QuotaPlanType plan_type = 3;
    bool is_ultimate = 4;
    string transaction_id = 5;
}

// =============================================================================
// DTO Types (for interface methods)
// =============================================================================

message CreditsInfoProto {
    bool is_initialized = 1;
    int32 credits = 2;
    bool should_show_toast = 3;
}

message ExecuteActionResultProto {
    bool success = 1;
    int32 code = 2;
    string message = 3;
}

message GrainResultIntProto {
    bool success = 1;
    string message = 2;
    int32 data = 3;
}

message GrainResultSubscriptionListProto {
    bool success = 1;
    string message = 2;
    repeated SubscriptionInfoProto data = 3;
}

// =============================================================================
// State
// =============================================================================

message UserQuotaState {
    string user_id = 1;
    int32 credits = 2;
    bool has_initial_credits = 3;
    bool has_shown_initial_credits_toast = 4;
    SubscriptionInfoProto subscription = 5;
    map<string, RateLimitInfoProto> rate_limits = 6;
    SubscriptionInfoProto ultimate_subscription = 7;
    google.protobuf.Timestamp created_at = 8;
    bool can_receive_invite_reward = 9;
    DailyImageConversationInfoProto daily_image_conversation = 10;
    optional FreeTrialInfoProto free_trial_info = 11;
    repeated string one_time_transaction_ids = 12;
}

// =============================================================================
// Events
// =============================================================================

message InitializeCreditsEvent {
    int32 initial_credits = 1;
}

message SetShownCreditsToastEvent {
    bool has_shown_initial_credits_toast = 1;
}

message UpdateRateLimitEvent {
    string action_type = 1;
    RateLimitInfoProto rate_limit_info = 2;
}

message ClearRateLimitEvent {
    string action_type = 1;
}

message UpdateSubscriptionEvent {
    SubscriptionInfoProto subscription_info = 1;
    bool is_ultimate = 2;
}

message CancelSubscriptionEvent {
    bool is_ultimate = 1;
}

message UpdateCreditsEvent {
    int32 new_credits = 1;
}

message UpdateCanReceiveInviteRewardEvent {
    bool can_receive_invite_reward = 1;
    google.protobuf.Timestamp created_at = 2;
}

message ClearAllQuotaEvent {
    bool can_receive_invite_reward = 1;
}

message AddPurchasedCreditsEvent {
    int32 credits_amount = 1;
    string transaction_id = 2;
    google.protobuf.Timestamp purchase_date = 3;
}

message UpdateDailyImageConversationEvent {
    DailyImageConversationInfoProto daily_image_conversation = 1;
}

message ActivateFreeTrialEvent {
    int32 trial_days = 1;
    QuotaPlanType plan_type = 2;
    bool is_ultimate = 3;
    google.protobuf.Timestamp start_date = 4;
    google.protobuf.Timestamp end_date = 5;
}

// =============================================================================
// RPC Request/Response Types
// =============================================================================

message SetShownCreditsToastRequestProto {
    string user_id = 1;
    bool has_shown_initial_credits_toast = 2;
}

message UpdateCreditsRequestProto {
    string user_id = 1;
    string operator_user_id = 2;
    int32 credits_change = 3;
}

message UpdateCreditsResponseProto {
    bool success = 1;
    string message = 2;
    int32 data = 3;
}

message UpdateSubscriptionRequestProto {
    string user_id = 1;
    string operator_user_id = 2;
    int32 plan_type = 3;  // PlanType enum value
    bool is_ultimate = 4;
}

message UpdateSubscriptionResponseProto {
    bool success = 1;
    string message = 2;
    repeated SubscriptionInfoProto data = 3;
}

message CanUploadImageResponseProto {
    bool success = 1;
    string message = 2;
    bool can_upload = 3;
}

message ExecuteActionRequestProto {
    string user_id = 1;
    string session_id = 2;
    string chat_manager_guid = 3;
    int32 action_type = 4;  // ActionType enum value
}

