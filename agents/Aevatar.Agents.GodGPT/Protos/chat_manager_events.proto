syntax = "proto3";

package aevatar.agents.godgpt.chatmanager.events;

option csharp_namespace = "Aevatar.Agents.GodGPT.Protos.ChatManagerEvents";

import "google/protobuf/timestamp.proto";

// =====================================================
// Base response event (replaces ResponseToPublisherEventBase)
// =====================================================
message ResponseEventBaseProto {
    optional string correlation_id = 1;
    google.protobuf.Timestamp timestamp = 2;
}

// =====================================================
// Response types enum
// =====================================================
enum ResponseTypeProto {
    RESPONSE_TYPE_UNSPECIFIED = 0;
    RESPONSE_TYPE_CREATE_SESSION = 1;
    RESPONSE_TYPE_CHAT_RESPONSE = 2;
    RESPONSE_TYPE_SESSION_LIST_RESPONSE = 3;
    RESPONSE_TYPE_SESSION_CHAT_HISTORY = 4;
    RESPONSE_TYPE_SESSION_DELETE = 5;
    RESPONSE_TYPE_SESSION_RENAME = 6;
    RESPONSE_TYPE_CLEAR_ALL = 7;
    RESPONSE_TYPE_SET_USER_PROFILE = 8;
    RESPONSE_TYPE_GET_USER_PROFILE = 9;
}

// =====================================================
// Voice content type enum
// =====================================================
enum VoiceContentTypeProto {
    VOICE_CONTENT_TYPE_VOICE_TO_TEXT = 0;
    VOICE_CONTENT_TYPE_VOICE_RESPONSE = 1;
}

// =====================================================
// Chat error code enum
// =====================================================
enum ChatErrorCodeProto {
    CHAT_ERROR_CODE_SUCCESS = 0;
    CHAT_ERROR_CODE_PARAM_INVALID = 20001;
    CHAT_ERROR_CODE_VOICE_PARSING_FAILED = 20002;
    CHAT_ERROR_CODE_INSUFFICIENT_CREDITS = 20003;
    CHAT_ERROR_CODE_RATE_LIMIT_EXCEEDED = 20004;
}

// =====================================================
// Audio metadata (replaces AudioMetadata)
// =====================================================
message AudioMetadataProto {
    double duration = 1;        // Duration in seconds
    int32 size_bytes = 2;       // File size in bytes
    int32 sample_rate = 3;      // Sample rate (16000 Hz)
    int32 bit_rate = 4;         // Bit rate (24000 bps)
    string format = 5;          // Audio format (mp3)
    int32 language_type = 6;    // VoiceLanguageEnum value
}

// =====================================================
// ResponseCreateGod (replaces ResponseCreateGod class)
// =====================================================
message ResponseCreateGodProto {
    // Base fields from ResponseToPublisherEventBase
    optional string correlation_id = 1;
    google.protobuf.Timestamp timestamp = 2;
    
    // Specific fields
    ResponseTypeProto response_type = 3;
    string session_id = 4;      // GUID as string
    string session_version = 5;
}

// =====================================================
// ResponseStreamGodChat (replaces ResponseStreamGodChat class)
// =====================================================
message ResponseStreamGodChatProto {
    // Base fields from ResponseToPublisherEventBase
    optional string correlation_id = 1;
    google.protobuf.Timestamp timestamp = 2;
    
    // Specific fields
    ResponseTypeProto response_type = 3;
    string response = 4;
    string new_title = 5;
    string chat_id = 6;
    bool is_last_chunk = 7;
    int32 serial_number = 8;
    string session_id = 9;      // GUID as string
    optional bytes audio_data = 10;
    optional AudioMetadataProto audio_metadata = 11;
    ChatErrorCodeProto error_code = 12;
    VoiceContentTypeProto voice_content_type = 13;
    repeated string suggested_items = 14;
}

// =====================================================
// ChatMessageMeta (replaces ChatMessageMeta class)
// =====================================================
message ChatMessageMetaProto {
    bool is_voice_message = 1;
    int32 voice_language = 2;   // VoiceLanguageEnum value
    bool voice_parse_success = 3;
    optional string voice_parse_error_message = 4;
    double voice_duration_seconds = 5;
}
