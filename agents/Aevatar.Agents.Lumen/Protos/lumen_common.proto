// ============ 反馈类型枚举 ============
enum FeedbackTypeEnum {
    FEEDBACK_ACCURACY = 0;
    FEEDBACK_CLARITY = 1;
    FEEDBACK_TONE = 2;
    FEEDBACK_LENGTH = 3;
    FEEDBACK_DESIGN = 4;
    FEEDBACK_BUG = 5;
}

// ============ 方法统计消息 ============
message MethodStats {
    int32 total_ratings = 1;
    int32 positive_count = 2;
    int32 negative_count = 3;
}

// ============ 反馈详情消息 ============
message FeedbackDetail {
    string prediction_method = 1;
    int32 rating = 2;  // 0 = 不喜欢, 1 = 喜欢
    repeated string feedback_types = 3;
    optional string comment = 4;
    optional string email = 5;
    bool agree_to_contact = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
}

// ============ 收藏详情消息 ============
message FavouriteDetail {
    DateValue date = 1;
    string prediction_id = 2;
    google.protobuf.Timestamp favourited_at = 3;
}

// ============ 生成锁信息 ============
message GenerationLockInfo {
    bool is_generating = 1;
    optional google.protobuf.Timestamp started_at = 2;
    int32 retry_count = 3;
}

// ============ 翻译锁信息 ============
message TranslationLockInfo {
    bool is_translating = 1;
    optional google.protobuf.Timestamp started_at = 2;
    string source_language = 3;
}

// ============ 公共结果消息 ============
message OperationResult {
    bool success = 1;
    string message = 2;
}

message ClearUserResult {
    bool success = 1;
    string message = 2;
}

