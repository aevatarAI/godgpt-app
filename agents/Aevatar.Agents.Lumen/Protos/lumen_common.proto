syntax = "proto3";
package lumen;

option csharp_namespace = "Aevatar.Agents.Lumen.Protos";

import "google/protobuf/timestamp.proto";

// ============ 日期/时间类型 ============
// Protobuf 不原生支持 DateOnly/TimeOnly，需要自定义消息

message DateValue {
    int32 year = 1;
    int32 month = 2;
    int32 day = 3;
}

message TimeValue {
    int32 hour = 1;
    int32 minute = 2;
    int32 second = 3;
}

