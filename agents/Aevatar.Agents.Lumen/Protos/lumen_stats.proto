syntax = "proto3";
package lumen;

option csharp_namespace = "Aevatar.Agents.Lumen.Protos";

import "google/protobuf/timestamp.proto";

// ============ State ============

// Stats for a single method - used in maps
message MethodStatsValue {
    int32 total_rating = 1;
    int32 count = 2;
    double avg_rating = 3;
    int32 positive_count = 4;    // Count of ratings >= 3 (3-5 stars)
    double positive_rate = 5;    // PositiveCount / Count
}

// User stats container - maps method name to stats
message UserMethodStats {
    map<string, MethodStatsValue> method_stats = 1;
}

message LumenStatsSnapshotState {
    // Global stats: method_name -> stats
    map<string, MethodStatsValue> global_stats = 1;
    
    // User stats: user_id -> (method_name -> stats)
    map<string, UserMethodStats> user_stats = 2;
    
    google.protobuf.Timestamp last_snapshot_at = 3;
}

// ============ Events ============

message StatsSnapshotEvent {
    map<string, MethodStatsValue> global_stats = 1;
    map<string, UserMethodStats> user_stats = 2;
    google.protobuf.Timestamp snapshot_at = 3;
}

// ============ Request/Response DTOs ============

message GetStatsSnapshotResult {
    bool success = 1;
    string message = 2;
    map<string, MethodStatsValue> global_stats = 3;
    map<string, UserMethodStats> user_stats = 4;
    google.protobuf.Timestamp last_snapshot_at = 5;
}

