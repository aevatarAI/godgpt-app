name: Package Management Web Dev

on:
  push:
    branches:
      - "deploy/management-web"

run-name: Deploy GodGPT Management Web on ${{ github.ref }} to Dev from ${{ github.sha }}

env:
  DOTNET_INSTALL_DIR: "./.dotnet"

concurrency:
  group: package-management-web-dev-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-build-and-push-image:
    runs-on: godgpt-runner
    strategy:
      matrix:
        servicename:
          [
            Aevatar.Web
          ]
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up .NET 9 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
     
      # Setup Node.js (for ABP)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      # Install ABP CLI
      - name: Install ABP CLI
        run: dotnet tool install -g Volo.Abp.Cli --version 9.0.3

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # Install frontend deps
      - name: Install NPM dependencies
        working-directory: apps/Aevatar.App/src/Aevatar.Web
        run: npm install

      # Install ABP client-side libs
      - name: Install ABP libs
        working-directory: apps/Aevatar.App/src/Aevatar.Web
        run: abp install-libs

      # Cache NuGet packages to speed up builds
      - name: Cache NuGet Packages
        id: nuget-packages
        uses: actions/cache@v4
        env:
          cache-name: nuget-package-cache
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ matrix.servicename }}

      # Publish .NET project
      - name: Publish .NET project      
        run: dotnet publish apps/Aevatar.App/src/${{ matrix.servicename }}/${{ matrix.servicename }}.csproj -c Release -o out/${{ matrix.servicename }}
      
      # Extract short SHA for versioning
      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "short_sha=$calculatedSha" >> "$GITHUB_OUTPUT"
      
      # Set image name for each servicename
      - name: Set image name
        id: image
        run: |
          if [ "${{ matrix.servicename }}" = "Aevatar.Web" ]; then
            echo "image_name=${{ secrets.REPOSITORY_REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ secrets.REPOSITORY }}/godgpt.app.management.web" >> $GITHUB_OUTPUT
          fi

      # Generate image tag metadata
      - name: Create image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image_name }}
          tags: |
            type=sha

      # Setup Docker Buildx (multi-platform builds & cache support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      # Build and push Docker image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            servicename=${{ matrix.servicename }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch:
    runs-on: godgpt-runner
    needs: publish-build-and-push-image
    steps:
      - name: Deploy
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.TOK }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'AElfDevops',
              repo: 'devops',
              workflow_id: 'godgpt-app-management-web.yaml',
              ref: 'main',
              inputs: {
                env: 'dev',
                commit_sha: 'sha-${{ needs.publish-build-and-push-image.outputs.short_sha }}',
              }
            })