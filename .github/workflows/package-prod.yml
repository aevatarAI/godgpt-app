name: Package Production

on:
  push:
    tags:
      - "v*"

run-name: Deploy godgpt-app on ${{ github.ref }} to Production from ${{ github.sha }}
env:
  DOTNET_INSTALL_DIR: "./.dotnet"
concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: aismart-runner
    strategy:
      matrix:
        servicename:
          [
            Aevatar.App.HttpApi.Host,
            Aevatar.App.DbMigrator,
            Aevatar.Silo,
            Aevatar.AuthServer
          ]
    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      # Cache NuGet packages to speed up builds
      - name: Cache NuGet Packages
        id: nuget-packages
        uses: actions/cache@v4
        env:
          cache-name: nuget-package-cache
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ matrix.servicename }}
      
      # Publish .NET project
      - name: Publish .NET project      
        run: dotnet publish apps/Aevatar.App/src/${{ matrix.servicename }}/${{ matrix.servicename }}.csproj -o out/${{ matrix.servicename }}
     
      # Upload build artifacts for the next job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.servicename }}
          path: out/${{ matrix.servicename }}
          retention-days: 1

  build-and-push-image:
    needs: publish
    runs-on: aismart-runner
    strategy:
      matrix:
        servicename:
          [
            Aevatar.App.HttpApi.Host,
            Aevatar.App.DbMigrator,
            Aevatar.Silo,
            Aevatar.AuthServer
          ]
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      # Checkout code (used for Docker build context)
      - name: Checkout
        uses: actions/checkout@v4

      # Extract short SHA for versioning
      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "short_sha=$calculatedSha" >> "$GITHUB_OUTPUT"

      # Download published build artifact
      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.servicename }}
          path: out/${{ matrix.servicename }}

      # Generate image tag metadata
      - name: Create image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REPOSITORY_REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ secrets.REPOSITORY }}/godgpt-app.${{ matrix.servicename }}
          tags: |
            type=ref,event=tag

      # Setup Docker Buildx (multi-platform builds & cache support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      # Build and push Docker image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            servicename=${{ matrix.servicename }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max