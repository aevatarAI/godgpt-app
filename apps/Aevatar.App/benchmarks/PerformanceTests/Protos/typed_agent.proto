syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Aevatar.App.PerformanceTests";

// State for TypedAgent used in multi-topic benchmark
message TypedAgentState {
  string agent_id = 1;
  string agent_type = 2;
  int32 processed_count = 3;
  string last_message = 4;
  google.protobuf.Timestamp last_updated = 5;
  string stream_namespace = 6;  // Custom stream namespace for this agent
}

// Message for TypedAgent
message TypedMessage {
  string content = 1;
  string sender_type = 2;
  google.protobuf.Timestamp timestamp = 3;
}

